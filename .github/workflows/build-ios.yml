name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew update
          brew install cmake ninja meson pkgconf xcodegen glslang

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Fetch MoltenVK, setup VULKAN_SDK, and stage fonts
        run: |
          chmod +x scripts/build/ios/*.sh
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

          mkdir -p "$HOME/vulkan-sdk-ios/lib"
          MVK_STATIC=$(find "$HOME/GeneralsX/MoltenVK" -path "*/ios-arm64/libMoltenVK.a" | head -n 1)
          MVK_INC=$(find "$HOME/GeneralsX/MoltenVK" -type d -name "vulkan" | head -n 1)

          if [[ -z "$MVK_STATIC" || -z "$MVK_INC" ]]; then
            MVK_URL=$(grep -Eo 'https://github\.com/KhronosGroup/MoltenVK/releases/download/[^"'\'' ]+' scripts/build/ios/fetch-moltenvk.sh | head -n 1)
            if [[ -z "$MVK_URL" ]]; then
              MVK_URL="https://github.com/KhronosGroup/MoltenVK/releases/download/v1.2.11/MoltenVK-all.tar"
            fi
            mkdir -p /tmp/mvk-full
            curl -L "$MVK_URL" -o /tmp/mvk-full/moltenvk.tar
            tar -xf /tmp/mvk-full/moltenvk.tar -C /tmp/mvk-full
            MVK_STATIC=$(find /tmp/mvk-full -path "*/ios-arm64/libMoltenVK.a" | head -n 1)
            MVK_INC=$(find /tmp/mvk-full -type d -name "vulkan" | head -n 1)
          fi

          XC_ROOT=$(dirname "$(dirname "$MVK_STATIC")")
          INC_ROOT=$(dirname "$MVK_INC")
          cp -R "$XC_ROOT" "$HOME/vulkan-sdk-ios/lib/MoltenVK.xcframework"
          cp -R "$INC_ROOT" "$HOME/vulkan-sdk-ios/include"
          echo "VULKAN_SDK=$HOME/vulkan-sdk-ios" >> "$GITHUB_ENV"

      - name: Pre-download FetchContent dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/deps-src/SDL3" "$HOME/deps-src/SDL3_image" "$HOME/deps-src/openal-soft" /tmp/deps-dl

          if gh release download release-3.4.2 --repo libsdl-org/SDL --pattern "SDL3-3.4.2.tar.gz" --dir /tmp/deps-dl; then
            tar -xzf /tmp/deps-dl/SDL3-3.4.2.tar.gz --strip-components=1 -C "$HOME/deps-src/SDL3"
          else
            git clone --depth 1 --branch release-3.4.2 https://github.com/libsdl-org/SDL.git "$HOME/deps-src/SDL3"
          fi

          if gh release download release-3.4.0 --repo libsdl-org/SDL_image --pattern "SDL3_image-3.4.0.tar.gz" --dir /tmp/deps-dl; then
            tar -xzf /tmp/deps-dl/SDL3_image-3.4.0.tar.gz --strip-components=1 -C "$HOME/deps-src/SDL3_image"
          else
            git clone --depth 1 --branch release-3.4.0 https://github.com/libsdl-org/SDL_image.git "$HOME/deps-src/SDL3_image"
          fi

          if gh release download 1.24.2 --repo kcat/openal-soft --pattern "openal-soft-1.24.2.tar.bz2" --dir /tmp/deps-dl; then
            tar -xjf /tmp/deps-dl/openal-soft-1.24.2.tar.bz2 --strip-components=1 -C "$HOME/deps-src/openal-soft"
          else
            git clone --depth 1 --branch 1.24.2 https://github.com/kcat/openal-soft.git "$HOME/deps-src/openal-soft"
          fi

      - name: Configure and build Zero Hour engine for iOS
        run: |
          cmake --preset ios-vulkan \
            -DFETCHCONTENT_SOURCE_DIR_SDL3="$HOME/deps-src/SDL3" \
            -DFETCHCONTENT_SOURCE_DIR_SDL3_IMAGE="$HOME/deps-src/SDL3_image" \
            -DFETCHCONTENT_SOURCE_DIR_OPENAL_SOFT="$HOME/deps-src/openal-soft"
          cmake --build build/ios-vulkan --target z_generals -j$(sysctl -n hw.ncpu)

      - name: Package unsigned IPA for KSign
        run: |
          set -euo pipefail
          PROJECT_ROOT="$PWD"
          BUILD_DIR="${PROJECT_ROOT}/build/ios-vulkan"
          IOS_DIR="${PROJECT_ROOT}/ios"
          DERIVED="${IOS_DIR}/build"
          OUT_DIR="${PROJECT_ROOT}/build/ios-package"
          APP_NAME="GeneralsXZH"
          GAME_BIN="${BUILD_DIR}/GeneralsMD/GeneralsXZH.app/GeneralsXZH"
          DXVK_BUILD="${BUILD_DIR}/_deps/dxvk-build-macos"

          if [[ ! -f "${GAME_BIN}" ]]; then
            echo "ERROR: engine binary not found at ${GAME_BIN}"
            exit 1
          fi

          (cd "${IOS_DIR}" && xcodegen generate --quiet)

          xcodebuild -project "${IOS_DIR}/${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${DERIVED}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          SHELL_APP="${DERIVED}/Build/Products/Release-iphoneos/${APP_NAME}.app"
          if [[ ! -d "${SHELL_APP}" ]]; then
            echo "ERROR: shell app not produced at ${SHELL_APP}"
            exit 1
          fi

          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"
          cp -R "${SHELL_APP}" "${OUT_DIR}/"
          APP="${OUT_DIR}/${APP_NAME}.app"

          cp "${GAME_BIN}" "${APP}/${APP_NAME}"

          mkdir -p "${APP}/Frameworks"
          for lib in \
            "${DXVK_BUILD}/src/d3d8/libdxvk_d3d8.0.dylib" \
            "${DXVK_BUILD}/src/d3d9/libdxvk_d3d9.0.dylib" \
            "${BUILD_DIR}/_deps/sdl3-build/libSDL3.0.dylib" \
            "${BUILD_DIR}/_deps/sdl3_image-build/libSDL3_image.0.dylib" \
            "${BUILD_DIR}/_deps/openal_soft-build/libopenal.1.24.2.dylib" \
            "${BUILD_DIR}/libgamespy.dylib"; do
            if [[ -f "${lib}" ]]; then
              cp "${lib}" "${APP}/Frameworks/"
              echo "Embedded $(basename "${lib}")"
            elif [[ "$(basename "${lib}")" != "libgamespy.dylib" ]]; then
              echo "ERROR: missing required dylib ${lib}"
              exit 1
            fi
          done

          if [[ -f "${APP}/Frameworks/libopenal.1.24.2.dylib" ]]; then
            mv "${APP}/Frameworks/libopenal.1.24.2.dylib" "${APP}/Frameworks/libopenal.1.dylib"
          fi

          MVK_FRAMEWORK=$(find "${HOME}/GeneralsX/MoltenVK" /tmp/mvk-full -path "*/ios-arm64/MoltenVK.framework" 2>/dev/null | head -n 1)
          if [[ -z "${MVK_FRAMEWORK}" || ! -d "${MVK_FRAMEWORK}" ]]; then
            echo "ERROR: MoltenVK.framework not found"
            exit 1
          fi
          cp -R "${MVK_FRAMEWORK}" "${APP}/Frameworks/"
          echo "Embedded MoltenVK.framework"

          mkdir -p "${APP}/GameData/fonts"
          cp "${HOME}/GeneralsX/ios-staging/fonts/"*.ttf "${APP}/GameData/fonts/"
          cp "${IOS_DIR}/config/dxvk.conf" "${APP}/GameData/dxvk.conf"
          cp "${IOS_DIR}/config/Options.ini" "${APP}/GameData/DefaultOptions.ini"

          ICON_SRC="${IOS_DIR}/Stub/Assets.xcassets/AppIcon.appiconset/icon.png"
          if [[ -f "${ICON_SRC}" ]]; then
            sips -z 120 120 "${ICON_SRC}" --out "${APP}/AppIcon60x60@2x.png" >/dev/null
            sips -z 152 152 "${ICON_SRC}" --out "${APP}/AppIcon76x76@2x.png" >/dev/null
            sips -z 167 167 "${ICON_SRC}" --out "${APP}/AppIcon83.5x83.5@2x.png" >/dev/null
          fi

          install_name_tool -add_rpath "@executable_path/Frameworks" "${APP}/${APP_NAME}" 2>/dev/null || true

          for f in "${APP}/Frameworks/"*.dylib; do
            [[ -f "$f" ]] && codesign --force --sign - --timestamp=none "$f"
          done
          codesign --force --sign - --timestamp=none "${APP}/Frameworks/MoltenVK.framework"
          codesign --force --sign - --timestamp=none "${APP}"

          mkdir -p "${OUT_DIR}/Payload"
          cp -R "${APP}" "${OUT_DIR}/Payload/"
          (cd "${OUT_DIR}" && zip -qry GeneralsXZH-iOS-Unsigned.ipa Payload)
          ls -lh "${OUT_DIR}/GeneralsXZH-iOS-Unsigned.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-iOS-IPA
          path: build/ios-package/GeneralsXZH-iOS-Unsigned.ipa
          retention-days: 14
